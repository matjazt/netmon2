spring:
  application:
    name: netmon2

  profiles:
    active: local

  mandatory-file-encoding: UTF-8

  datasource:
    url: changeit
    username: changeit
    password: changeit
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      auto-commit: false

  jpa:
    hibernate:
      ddl-auto: none # important for DB-first
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        generate_statistics: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        flush_mode: COMMIT
    open-in-view: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

netmon:
  cors:
    # Allowed frontend origins.
    # Use "*" for development (allows any origin).
    # For production, set your actual frontend domain, e.g.:
    #   allowed-origins: "https://app.example.com"
    # Override with env var (comma-separated or indexed):
    #   NETMON_CORS_ALLOWED_ORIGINS=https://app.example.com
    allowed-origins:
      - "*"
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    # Set to true only when allowed-origins lists specific domains (not "*")
    allow-credentials: false
    max-age: 3600

  cache:
    network-config:
      maximum-size: 1000
      expire-after-write: 5m
    security:
      maximum-size: 1000
      expire-after-write: 1m

logbook:
  # Master switch. Set to false (or NETMON_LOGBOOK_FILTER_ENABLED=false) to disable entirely.
  filter:
    enabled: true
  format:
    style: http # human-readable HTTP wire format
  write:
    level: TRACE # log level used by Logbook writers
  predicate:
    include: # log every path; add exclusions below if needed
      # - path: /**
      - path: /netmon2/api/**
    exclude:
      - path: /netmon2/actuator/**
      - path: /netmon2/v3/**
      - path: /netmon2/swagger-ui/**

logging:
  level:
    org.hibernate.SQL: OFF
    # org.hibernate.SQL: DEBUG
    # org.hibernate.stat: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE
    com.matjazt.tools.SvcWatchDogClient: INFO
    com.matjazt: TRACE
    # Set to TRACE to see Logbook output; set to OFF to silence it without disabling the filter
    org.zalando.logbook: TRACE

server:
  port: 8080
  servlet:
    context-path: /netmon2
  forward-headers-strategy: framework # Trust X-Forwarded-* headers

# Actuator configuration for health checks and monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info # Expose only health and info endpoints
  endpoint:
    health:
      show-details: always

mqtt:
  url: changeit
  client-id: netmon2
  username: changeit
  password: changeit
  topic-template: network/{networkName}/scan
  truststore-path: # Optional: Path to JKS truststore for self-signed CA certificates
  truststore-password: # Optional: Truststore password (required if truststore-path is set)
  automatic-reconnect: true # Enable automatic reconnection on connection loss
  clean-session: false # Persistent session (false) vs clean session (true)
  qos: 1 # Quality of Service level (0=at most once, 1=at least once, 2=exactly once)
  connection-timeout: 30 # Connection timeout in seconds
  keep-alive-interval: 60 # Keep-alive interval in seconds
  completion-timeout: 5000 # Completion timeout in milliseconds
  ssl-verify-hostname: true # Verify SSL hostname (disable only for testing)

email-delivery:
  smtp-host: change-me
  smtp-port: 587
  smtp-username: change-me
  smtp-password: change-me
  smtp-starttls: true
  smtp-auth: true

# Buffered Email Logging Configuration
# These properties are used by BufferedEmailAppender in logback-spring.xml
# Configure via environment variables using relaxed binding (e.g., EMAIL_LOGGING_SMTP_HOST)
# or override in application-{profile}.yml
email-logging:
  # Email addresses
  email-from: change-me
  email-to: change-me
  email-subject-prefix: "[netmon2]"

  # Buffering behavior
  max-count: 100 # Send email when buffer reaches this many logs
  max-delay-seconds: 300 # Send email after this many seconds (300 seconds)
  min-level: WARN # Minimum log level to buffer (ERROR, WARN, INFO, DEBUG, TRACE)

alerter:
  from-email: changeit # Sender email address
  from-name: netmon2 # Sender display name
  interval-seconds: 20 # Alert processing interval in seconds
  initial-delay-seconds: 30 # Initial delay before first alert processing in seconds
